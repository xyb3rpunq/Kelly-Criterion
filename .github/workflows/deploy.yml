name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the market snapshot without anyone pushing. The snapshot is baked
  # into the deployed artifact, so this never writes a commit back to the repo.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied Pages
# deployment is worse than a slightly delayed one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (Kelly maths)
        run: npm test

      - name: Fetch market snapshot
        run: npm run fetch:market
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
